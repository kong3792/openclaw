name: CI Integration Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '설계/**'
      - 'subagent/**'
      - 'memory/**'

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" pandas==1.5.3 numexpr==2.8.4 bottleneck==1.3.5

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" pandas==1.5.3

      - name: Run integration tests
        run: |
          python3 subagent/TKT-20260307-0001/integration_test_modules.py || true
        shell: bash

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.os }}
          path: |
            subagent/TKT-20260307-0001/integration_test_modules.py
            subagent/TKT-20260307-0001/integration_test_with_mocks.py
